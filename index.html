<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stipend Ledger</title>
<meta name="theme-color" content="#2B44B8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0} [hidden]{display:none!important}
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --sunk:#E2E8E3; --ink:#14211D; --muted:#5A6A64; --line:#D3DCD6;
  --accent:#2B44B8; --accent-ink:#FFFFFF; --accent-soft:#E1E6FA;
  --good:#1C7748; --good-soft:#DCEFE3; --warn:#8F5B00; --warn-soft:#FBEFD3; --bad:#B3261E; --bad-soft:#F8E0DD;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --sunk:#222C28; --ink:#E5EEEA; --muted:#93A39C; --line:#2C3833;
  --accent:#93A6FF; --accent-ink:#0D1433; --accent-soft:#1F2748;
  --good:#5FCB8E; --good-soft:#163222; --warn:#E8B24F; --warn-soft:#34280F; --bad:#FF8C82; --bad-soft:#3B1816; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --sunk:#222C28; --ink:#E5EEEA; --muted:#93A39C; --line:#2C3833;
  --accent:#93A6FF; --accent-ink:#0D1433; --accent-soft:#1F2748;
  --good:#5FCB8E; --good-soft:#163222; --warn:#E8B24F; --warn-soft:#34280F; --bad:#FF8C82; --bad-soft:#3B1816; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 150px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-stretch:88%}
h1{font-size:1.6rem;font-weight:750;letter-spacing:-.01em}
h2{font-size:1.02rem;font-weight:700;letter-spacing:.01em}
.num,.big,dd,.amt{font-variant-numeric:tabular-nums;font-family:var(--display)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.85rem}
p{margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:6px}
.top-meta{color:var(--muted);font-size:.85rem;text-align:right}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.big{font-size:3.4rem;font-weight:800;line-height:1;letter-spacing:-.02em;font-stretch:80%}
.big.neg{color:var(--bad)}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.over span{background:var(--bad)}
.heroline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:.9rem;color:var(--muted)}
.heroline b{font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
.pos{color:var(--good)!important} .negc{color:var(--bad)!important}
.bals{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:8px;border-top:1px solid var(--line);padding-top:12px}
.bals:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.bal{display:flex;flex-direction:column;gap:1px;min-width:0}
.bn{font-size:.72rem;color:var(--muted);font-weight:600;white-space:nowrap}
.bv{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;white-space:nowrap}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.opt b{font-family:var(--display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.opt span{font-size:.86rem;color:var(--muted)}
.opt.off{opacity:.55;cursor:default}
.opt:not(.off):hover{border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;font-size:.9rem}
.alert p{min-width:0}
.alert.bad{background:var(--bad-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--bad)}
.alert.warn{background:var(--warn-soft);box-shadow:inset 3px 0 0 var(--warn)}
.alert.info{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}

.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.list>.row:first-child,.list>div:first-child>.rowbtn .row,.list>.daygrp:first-child{border-top:0}
.row .l{min-width:0;display:flex;flex-direction:column;gap:1px}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .m{font-size:.8rem;color:var(--muted)}
.row .r{display:flex;align-items:center;gap:8px;flex-shrink:0;text-align:right}
.amt{font-weight:700;font-size:1.02rem;white-space:nowrap}
.amt.in{color:var(--good)}
.rowbtn{all:unset;display:block;width:100%;cursor:pointer;box-sizing:border-box}
.rowbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rowact{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;padding:0 14px 12px}
.daygrp{padding:8px 14px 6px;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--sunk);font-weight:600;display:flex;justify-content:space-between}

.pill{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.mute{background:var(--sunk);color:var(--muted)}

.btn{font:inherit;font-weight:650;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:10px 14px;cursor:pointer;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:.84rem;flex-shrink:0}
.btn.block{width:100%}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:650;font-size:.86rem;padding:4px 0}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}

.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:14px 20px;font:inherit;font-weight:700;font-size:1rem;box-shadow:0 6px 18px rgba(20,33,29,.25);cursor:pointer}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{all:unset;cursor:pointer;text-align:center;padding:12px 4px 14px;font-size:.82rem;font-weight:600;color:var(--muted);position:relative}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}

.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,16,14,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{all:unset;cursor:pointer;font-size:1.5rem;line-height:1;padding:4px 8px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:9px 2px;border-radius:9px;font-size:.84rem;font-weight:650;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span,.lbl{font-size:.8rem;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input[type=checkbox]{width:20px;height:20px;padding:0;margin:1px 0 0;flex-shrink:0;accent-color:var(--accent)}
input[type=file]{padding:8px}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:.78rem}
.amount-in{font-family:var(--display);font-size:2rem;font-weight:750;padding:8px 12px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.86rem;font-weight:600;cursor:pointer}
.chip input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.sub{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.hint{font-size:.82rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}

.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px}
.pl{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.pl:first-child{border-top:0}
.pl.tot{font-weight:700;border-top:2px solid var(--ink)}
.pl b{font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}

.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.bars{position:relative;height:130px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--line)}
.bars .b{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:0}
.bars .b.over{background:var(--bad)}
.bars .b.fut{background:var(--sunk);height:4px!important}
.bars .lim{position:absolute;left:0;right:0;border-top:2px dashed var(--warn)}
.bars .lim span{position:absolute;right:0;top:-18px;font-size:.7rem;color:var(--warn);font-weight:700;background:var(--surface);padding:0 3px}
.xax{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:6px 0}
.hbar .track{grid-column:1/-1;height:7px;background:var(--sunk);border-radius:99px;overflow:hidden}
.hbar .track span{display:block;height:100%;background:var(--accent)}
.empty{padding:18px 14px;color:var(--muted);font-size:.9rem;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;font-weight:600;width:max-content;max-width:calc(100% - 32px);display:flex;gap:14px;align-items:center}
.toast button{all:unset;cursor:pointer;font-weight:800;text-decoration:underline;text-underline-offset:3px;flex-shrink:0}
.mchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.mchips button{flex-shrink:0}
.mchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.oblrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.oblrow .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted)}
.storewarn{background:var(--bad-soft);color:var(--ink);padding:10px 12px;border-radius:12px;font-size:.86rem}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<button class="fab" id="fab" data-act="add" aria-label="Add entry">+ Add</button>
<nav class="tabs" id="tabs">
  <button data-tab="today">Today</button>
  <button data-tab="ledger">Ledger</button>
  <button data-tab="month">Month</button>
  <button data-tab="more">More</button>
</nav>
<div id="sheet"></div>
<div id="toast"></div>

<script>
/* ===================== helpers ===================== */
const KEY='stipend-ledger-v1'; // storage key kept from v1 so existing data is found; S.v holds the data version
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const nowTs=()=>today()+'T'+nowTime();
const mkey=s=>s.slice(0,7);
const nextKey=k=>{const [y,m]=k.split('-').map(Number);return m===12?(y+1)+'-01':y+'-'+pad(m+1);};
const prevKey=k=>{const [y,m]=k.split('-').map(Number);return m===1?(y-1)+'-12':y+'-'+pad(m-1);};
const daysInMonth=k=>{const [y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate();};
const monthEnd=k=>k+'-'+pad(daysInMonth(k));
const addDays=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return dstr(new Date(y,m-1,d+n));};
const addMonths=(s,n)=>{const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1+n,1);const dim=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();dt.setDate(Math.min(d,dim));return dstr(dt);};
const diffDays=(a,b)=>{const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/864e5);};
const r2=n=>Math.round(n*100)/100;
const num=v=>parseFloat(String(v??'').replace(/[,₹\s]/g,''));
const inr=n=>(Math.round(n)<0?'−':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const sinr=n=>(Math.round(n)>0?'+':'')+inr(n);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const FULLM=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtD=s=>{const [,m,d]=s.split('-').map(Number);return MON[m-1]+' '+d;};
const monthName=k=>FULLM[+k.slice(5)-1]+' '+k.slice(0,4);
const mon=k=>MON[+k.slice(5)-1];
const fullMon=k=>FULLM[+k.slice(5)-1];
const weekday=s=>{const [y,m,d]=s.split('-').map(Number);return WD[new Date(y,m-1,d).getDay()];};
const BANKS=['gpay','paytm','phonepe','cash'];
const SPEND_ACCTS=['gpay','paytm','cash'];
const CATS=['Food & snacks','Shopping','Travel','Personal care','Entertainment','Academic','Gifts','Misc'];
const aname=id=>id==='card'?'Credit card':(S.accounts[id]?S.accounts[id].name:id);
// A stipend logged on/after the 20th is next month's money; earlier means it arrived late for this month.
const stipendMonthFor=ts=>(+ts.slice(8,10)>=20?nextKey(mkey(ts)):mkey(ts));

let S, storeOK=true;
let ui={tab:'today',mode:null,sheet:null,openRow:null,openPerson:null,ledgerMonth:null,addType:'expense',prefill:null,editId:null,settlePid:null,
  setup:null,closeData:null,closeDrop:null,toast:null,toastUndo:false,undo:null,backupText:'',allAlerts:false,draftAmt:''};
let SP={}, BYID={};

/* ===================== state ===================== */
function seed(){
  const t=today();
  S={v:2,created:t,
    accounts:{
      gpay:{name:'GPay',floor:2000,bal:0},
      paytm:{name:'Paytm',floor:1000,bal:0},
      phonepe:{name:'PhonePe',floor:1000,bal:0},
      cash:{name:'Cash',floor:0,bal:0}},
    cardDue:0,
    settings:{ytAmount:59,ytDay:22,ytAcct:'paytm',cardDay:27,rechargeLast:619,rechargeNext:null,reconcileEvery:7,warnAt:{gpay:500,paytm:0,phonepe:0}},
    tx:[],people:[],history:[],lastReconcile:t,lastBackup:t,month:null};
  return S;
}
function migrate(d){
  if(!d.v||d.v<2){
    d.people=(d.lent||[]).map(l=>({id:l.id||uid(),person:l.person,amt:l.amt,dir:l.dir==='borrowed'?'owe':'owes',date:l.date||today(),settled:!!l.settled}));
    delete d.lent;
    for(const t of d.tx||[]){
      // v1: a logged stipend always belonged to the month after it arrived
      if(t.type==='income'&&t.sub==='stipend'&&!t.forMonth)t.forMonth=nextKey(mkey(t.ts));
      // v1 month-end transfers are dated in the new month but belong to the month just closed
      if(t.type==='transfer'&&t.to==='phonepe'&&t.note==='Month-end savings'&&!t.forMonth)t.forMonth=prevKey(mkey(t.ts));
      if(t.type==='adjust'&&!t.cls)t.cls='fix';
    }
    if(d.month&&!d.month.startTs)d.month.startTs=d.month.start+'T00:00';
    d.v=2;
  }
  d.settings=d.settings||{};
  d.settings.warnAt=d.settings.warnAt||{gpay:500,paytm:0,phonepe:0};
  d.people=d.people||[];d.history=d.history||[];d.tx=d.tx||[];
  return d;
}
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){storeOK=false;}
  if(raw){
    try{S=migrate(JSON.parse(raw));return;}
    catch(e){try{localStorage.setItem(KEY+'-unreadable-'+Date.now(),raw);}catch(_){}} // never silently overwrite unreadable data
  }
  seed();save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storeOK=true;}catch(e){storeOK=false;}}

/* ===================== transactions ===================== */
function apply(t,s){
  if(t.rec)return; // record-only: already included in balances typed at plan start
  const A=S.accounts;
  switch(t.type){
    case 'expense': if(t.acct==='card')S.cardDue+=s*t.amt; else A[t.acct].bal-=s*t.amt; break;
    case 'returned': case 'income': A[t.acct].bal+=s*t.amt; break;
    case 'transfer': A[t.from].bal-=s*t.amt; A[t.to].bal+=s*t.amt; break;
    case 'bill': if(t.acct==='card')S.cardDue+=s*t.amt; else A[t.acct].bal-=s*t.amt; if(t.kind==='card')S.cardDue-=s*t.amt; break;
    case 'adjust': if(t.acct==='card')S.cardDue+=s*t.amt; else A[t.acct].bal+=s*t.amt; break;
  }
}
function addTx(t){t.id=t.id||uid();S.tx.push(t);apply(t,1);return t;}
function editTx(id,f){ // keeps the id so links (shares, repayments) survive edits
  const t=S.tx.find(x=>x.id===id);if(!t)return null;
  apply(t,-1);for(const k of Object.keys(t))if(k!=='id')delete t[k];
  Object.assign(t,f);apply(t,1);return t;
}
const findObl=id=>S.month?S.month.obligations.find(o=>o.id===id):null;
function delTx(id){
  const i=S.tx.findIndex(x=>x.id===id);if(i<0)return;
  const t=S.tx[i];apply(t,-1);S.tx.splice(i,1);
  if(t.obl){const o=findObl(t.obl);
    if(o){o.paid=false;delete o.paidAmt;delete o.paidOn;}
    if(o&&o.kind==='move'){const h=S.history.find(h=>h.key===o.from);if(h)h.moved=(h.moved||0)-t.amt;}}
  if(t.type==='expense'){
    const p=S.people.find(p=>p.exp===t.id);
    if(p){if(gotFor(p)>0)p.exp=null;else S.people=S.people.filter(q=>q!==p);}
    for(const q of S.people)if(q.paidTx===t.id){q.settled=false;delete q.paidTx;}
  }
}
/* people: who owes whom. 'owes' = they owe you, 'owe' = you owe them */
const gotFor=p=>S.tx.filter(t=>t.type==='returned'&&t.pid===p.id).reduce((a,t)=>a+t.amt,0);
const remaining=p=>Math.max(0,p.amt-(p.dir==='owes'?gotFor(p):0));
const isOpen=p=>!p.settled&&remaining(p)>=0.5;
function syncShare(x){
  let p=S.people.find(p=>p.exp===x.id);
  if(x.share&&x.share.amt>0){
    if(!p){p={id:uid(),person:'',amt:0,dir:'owes',date:x.ts.slice(0,10),exp:x.id,settled:false};S.people.push(p);}
    p.person=x.share.who||'Friends';p.amt=x.share.amt;p.date=x.ts.slice(0,10);
  }else if(p){if(gotFor(p)>0){p.amt=gotFor(p);}else S.people=S.people.filter(q=>q!==p);}
}

/* ===================== dues ===================== */
function defaultObligations(k){
  const st=S.settings,dim=daysInMonth(k),L=[];
  if(S.cardDue>0)L.push({id:uid(),kind:'card',name:'Credit card bill',amount:Math.round(S.cardDue),due:k+'-'+pad(Math.min(st.cardDay,dim)),acct:'gpay',paid:false});
  L.push({id:uid(),kind:'yt',name:'YouTube Music',amount:st.ytAmount,due:k+'-'+pad(Math.min(st.ytDay,dim)),acct:st.ytAcct,auto:true,paid:false});
  if(st.rechargeNext&&mkey(st.rechargeNext)<=k){
    const due=st.rechargeNext<k+'-01'?k+'-01':st.rechargeNext;
    L.push({id:uid(),kind:'recharge',name:'Mobile recharge',amount:st.rechargeLast,due,acct:'gpay',paid:false});
  }
  return L;
}
function payObligation(o,amt,acct,ts,next){
  if(o.kind==='move'){
    addTx({type:'transfer',amt,from:acct,to:'phonepe',forMonth:o.from,note:o.name,obl:o.id,ts});
    const h=S.history.find(h=>h.key===o.from);if(h)h.moved=(h.moved||0)+amt;
  }else addTx({type:'bill',amt,acct,obl:o.id,kind:o.kind,name:o.name,ts});
  o.paid=true;o.paidAmt=amt;o.paidOn=ts.slice(0,10);
  if(o.kind==='recharge'){S.settings.rechargeLast=amt;if(next)S.settings.rechargeNext=next;}
}
function runAutopay(){
  if(!S.month)return;const t=today(),M=S.month;
  for(const o of M.obligations){
    if(o.auto&&!o.paid&&o.due<=t&&mkey(o.due)===M.key){
      let ts=o.due+'T09:00';if(M.startTs&&ts<M.startTs)ts=M.startTs;
      payObligation(o,o.amount,o.acct,ts);
    }
  }
}

/* ===================== the numbers ===================== */
// Logged spending per day (charts, ledger, "spent today"). A repayment linked to an
// expense comes off the day of that expense, not the day the money came back.
function buildSP(){
  SP={};BYID={};for(const t of S.tx)BYID[t.id]=t;
  for(const t of S.tx){
    if(t.type==='expense'){const d=t.ts.slice(0,10);SP[d]=(SP[d]||0)+t.amt;}
    else if(t.type==='returned'){const e=t.exp&&BYID[t.exp];if(e){const d=e.ts.slice(0,10);SP[d]=(SP[d]||0)-t.amt;}}
  }
}
// Net money moved into PhonePe that counts toward month k's savings target.
function movedFor(k){
  let m=0;
  for(const t of S.tx){if(t.type!=='transfer'||t.rec)continue;
    if((t.forMonth||mkey(t.ts))!==k)continue;
    if(t.to==='phonepe')m+=t.amt;if(t.from==='phonepe')m-=t.amt;}
  return Math.max(0,m);
}
// Money sitting in the spending accounts that must not be spent this month.
function heldFor(M){
  let extra=0,stipNext=0,stipLate=0,backOld=0;
  for(const t of S.tx){
    if(t.rec)continue;
    if(t.type==='income'&&t.sub==='extra'&&mkey(t.ts)===M.key)extra+=t.amt;
    if(t.type==='income'&&t.sub==='stipend'){
      const fm=t.forMonth||nextKey(mkey(t.ts));
      if(fm>M.key&&mkey(t.ts)<=M.key)stipNext+=t.amt;           // arrived early, for a later month
      else if(fm===M.key&&M.startTs&&t.ts>M.startTs)stipLate+=t.amt; // this month's, arrived after the plan was made
    }
    if(t.type==='returned'&&mkey(t.ts)===M.key){const e=t.exp&&BYID[t.exp];if(e&&mkey(e.ts)<M.key)backOld+=t.amt;} // repays an older month's spending -> savings
  }
  return {extra,stipNext,stipLate,backOld};
}
// Everything on the Today screen comes from here, and it is anchored to real balances.
function calc(M){
  buildSP();
  const t=today(),end=monthEnd(M.key),A=S.accounts;
  const usable=SPEND_ACCTS.reduce((a,id)=>a+A[id].bal-A[id].floor,0);
  const dues=M.obligations.filter(o=>!o.paid&&o.kind!=='card').reduce((a,o)=>a+(+o.amount||0),0);
  const card=S.cardDue;                      // all card spending is owed, whenever the statement comes
  const moved=movedFor(M.key),savingsLeft=Math.max(0,M.target-moved);
  const h=heldFor(M),held=h.extra+h.backOld+h.stipNext+h.stipLate;
  const left=usable-dues-card-savingsLeft-held; // money free for spending from now to month end
  const inMonth=t>=M.start&&t<=end;
  const daysAfter=inMonth?diffDays(t,end):0;
  const safe=left-M.limit*daysAfter;          // safe to spend today, keeping the daily limit for every later day
  const todaySpent=inMonth?(SP[t]||0):0;
  // ahead/behind: earlier days' under/overspending, plus today's overspend once you're past today's limit
  const ahead=inMonth?safe-(M.limit-todaySpent)-Math.max(0,todaySpent-M.limit):safe;
  const projected=Math.max(M.target,moved)+h.extra+h.backOld+ahead;
  const toMove=savingsLeft+h.extra+h.backOld+left;
  return {usable,dues,card,moved,savingsLeft,h,held,left,safe,todaySpent,ahead,projected,toMove,end,daysLeft:inMonth?daysAfter+1:0};
}
// One-tap Recalculate: absorb the ahead/behind amount into the daily limit or into the savings target.
function rebalance(M,c){
  const over=c.todaySpent>M.limit,n=Math.max(0,c.daysLeft-1);  // n = days after today
  const days=over?n:n+1, pool=over?c.left:c.left+c.todaySpent; // past today's limit -> today counts as done
  const D=Math.round(c.ahead);
  const newLimit=days>0&&pool>=0?Math.floor(pool/days):null;
  const floorT=Math.min(M.target,c.moved);                      // savings can't drop below what's already moved
  const newTarget=D<0?Math.max(floorT,M.target+D):M.target+D;
  return {D,over,days,newLimit,newTarget,covered:newTarget-M.target,
    limitOK:newLimit!==null&&newLimit!==M.limit,targetOK:newTarget!==M.target};
}
function monthSpend(k){
  buildSP();
  let spent=0;const cats={};
  const add=(c,v)=>{cats[c]=(cats[c]||0)+v;spent+=v;};
  for(const x of S.tx){
    const xm=mkey(x.ts);
    if(x.type==='expense'){if(xm===k)add(x.cat,x.amt);}
    else if(x.type==='returned'){const e=x.exp&&BYID[x.exp];
      if(e){if(mkey(e.ts)===k)add(e.cat,-x.amt);}else if(xm===k)spent-=x.amt;}
    else if(x.type==='adjust'&&xm===k){
      const out=x.acct==='card'?x.amt:-x.amt;
      if(x.cls==='unlogged')add('Not logged',out);
      else if(x.cls==='back')spent+=out;
    }
  }
  for(const c in cats)if(cats[c]<0.5)delete cats[c];
  return {spent,cats};
}
function buildMonth(k,start,target,obligations,startTs,planBy){
  const M={key:k,start,startTs,target,obligations,limit:0,planBy:planBy||'target',adj:[]};
  const c=calc(M);
  M.days=diffDays(start,monthEnd(k))+1;
  M.spendable=c.left;
  M.limit=Math.max(0,Math.floor(c.left/M.days));
  M.plan={usable:c.usable,card:c.card,dues:c.dues,savings:c.savingsLeft,moved:c.moved,held:c.held,spendable:c.left,limit:M.limit,target};
  return M;
}

/* ===================== alerts ===================== */
function alerts(c){
  const A=S.accounts,L=[],t=today(),M=S.month;
  if(c.h.stipLate>0)L.push({lvl:c.safe<0?'bad':'info',text:`Your ${inr(c.h.stipLate)} stipend came after this month's plan was made. Re-plan to spread it over the days left.`,act:{label:'Re-plan',type:'replan'}});
  if(c.safe<0&&!(c.h.stipLate>=-c.safe)){
    const planShort=(M.plan?M.plan.spendable:M.spendable)<0;
    if(planShort&&M.limit===0)L.push({lvl:'bad',text:`Your dues and savings target need ${inr(-c.safe)} more than you have. Lower the target and re-plan.`,act:{label:'Re-plan',type:'replan'}});
    else L.push({lvl:'bad',text:`You're ${inr(-c.safe)} past what's safe for today. Recalculate, or keep the next few days under ${inr(M.limit)} to catch up.`,act:{label:'Recalculate',type:'rebal'}});
  }
  const yt=M.obligations.find(o=>o.kind==='yt'&&!o.paid);
  for(const id of ['gpay','paytm','phonepe']){
    const a=A[id],gap=a.bal-a.floor;
    if(gap<0){
      if(id==='phonepe'){L.push({lvl:'warn',text:`PhonePe is ${inr(-gap)} below its ${inr(a.floor)} minimum. Money you move there counts toward this month's savings.`,act:{label:'Move '+inr(-gap),type:'transfer',from:'gpay',to:'phonepe',amt:Math.ceil(-gap)}});continue;}
      let need=-gap,more='';
      if(id==='paytm'&&yt&&yt.acct==='paytm'){need+=yt.amount;more=`, and YouTube Music (${inr(yt.amount)}) autopays from it on ${fmtD(yt.due)}`;}
      L.push({lvl:'bad',text:`${a.name} is ${inr(-gap)} below its ${inr(a.floor)} minimum${more}.`,act:id==='gpay'?null:{label:'Move '+inr(need),type:'transfer',from:'gpay',to:id,amt:Math.ceil(need)}});
    }else if(gap<((S.settings.warnAt||{})[id]||0))L.push({lvl:'warn',text:`${a.name} is only ${inr(gap)} above its minimum.`});
  }
  for(const o of M.obligations){
    if(o.paid||o.kind==='move'||o.kind==='planned')continue;
    const a=A[o.acct],dd=diffDays(t,o.due);
    if(a&&a.bal-a.floor>=0&&a.bal-a.floor<o.amount)L.push({lvl:'bad',text:`${a.name} doesn't have ${inr(o.amount)} above its minimum for ${o.name} (${fmtD(o.due)}).`,act:o.acct!=='gpay'?{label:'Move money',type:'transfer',from:'gpay',to:o.acct,amt:Math.ceil(o.amount-(a.bal-a.floor))}:null});
    if(dd<0&&!o.auto)L.push({lvl:'bad',text:`${o.name} (${inr(o.amount)}) was due ${fmtD(o.due)}.`,act:{label:'Pay',type:'pay',id:o.id}});
  }
  const rd=diffDays(S.lastReconcile,t);
  if(rd>=S.settings.reconcileEvery)L.push({lvl:'info',text:`${rd} days since your last balance check.`,act:{label:'Check now',type:'reconcile'}});
  if(diffDays(S.lastBackup,t)>=30)L.push({lvl:'info',text:'Time for your monthly backup.',act:{label:'Back up',type:'tab',tab:'more'}});
  const rank={bad:0,warn:1,info:2};
  return L.sort((a,b)=>rank[a.lvl]-rank[b.lvl]);
}

/* ===================== rows ===================== */
function txDesc(x){
  const time=x.ts.slice(11,16),rec=x.rec?' · record only':'';
  switch(x.type){
    case 'expense':{const sh=x.share&&x.share.amt?` · ${esc(x.share.who)} owe ${inr(x.share.amt)}`:'';
      return {t:esc(x.note||x.cat),m:`${x.note?esc(x.cat)+' · ':''}${aname(x.acct)} · ${time}${sh}${rec}`,a:inr(-x.amt),c:''};}
    case 'returned':{const e=x.exp&&BYID[x.exp];
      return {t:'Got back'+(x.note?' from '+esc(x.note):''),m:`Into ${aname(x.acct)} · ${time}${e?' · for '+esc(e.note||e.cat)+', '+fmtD(e.ts.slice(0,10)):''}${rec}`,a:'+'+inr(x.amt),c:'in'};}
    case 'income':return {t:x.sub==='stipend'?'Stipend':esc(x.note||'Extra income'),m:`${x.sub==='stipend'?'For '+fullMon(x.forMonth||nextKey(mkey(x.ts))):'Goes to savings'} · ${aname(x.acct)} · ${time}${rec}`,a:'+'+inr(x.amt),c:'in'};
    case 'transfer':return {t:esc(x.note||'Transfer'),m:`${aname(x.from)} → ${aname(x.to)} · ${time}${rec}`,a:inr(x.amt),c:''};
    case 'bill':return {t:esc(x.name),m:`Planned due · ${aname(x.acct)} · ${time}`,a:inr(-x.amt),c:''};
    case 'adjust':{const inn=x.acct==='card'?-x.amt:x.amt;const lab={unlogged:'Spent, not logged',back:'Got back, not logged',fix:'Balance correction'}[x.cls]||'Balance correction';
      return {t:lab,m:`${aname(x.acct)} · ${esc(x.note||'Balance check')}`,a:sinr(inn),c:inn>0?'in':''};}
  }
}
function txRow(x){
  const d=txDesc(x),open=ui.openRow===x.id,editable=['expense','returned','income','transfer'].includes(x.type);
  return `<div><button class="rowbtn" data-act="row" data-id="${x.id}" aria-expanded="${open}"><div class="row"><div class="l"><span class="t">${d.t}</span><span class="m">${d.m}</span></div><div class="r"><span class="amt ${d.c}">${d.a}</span></div></div></button>${open?`<div class="rowact">${editable?`<button class="btn sm" data-act="edit" data-id="${x.id}">Edit</button>`:'<span class="hint">To change a paid due, delete it and pay again.</span>'}<button class="btn sm danger" data-act="del" data-id="${x.id}">Delete</button></div>`:''}</div>`;
}
function oblStatus(o){
  if(o.paid)return '<span class="pill good">Paid</span>';
  if(o.kind==='planned'||o.kind==='move')return '';
  const dd=diffDays(today(),o.due);
  if(dd<0)return '<span class="pill bad">Overdue</span>';
  if(o.auto)return `<span class="pill info">Autopay ${fmtD(o.due)}</span>`;
  if(dd<=3)return `<span class="pill warn">${dd===0?'Today':dd===1?'Tomorrow':'In '+dd+' days'}</span>`;
  return '';
}
function oblRow(o){
  const meta=o.paid?(o.outside?'Paid before the plan started':'Paid '+inr(o.paidAmt)+(o.paidOn?' · '+fmtD(o.paidOn):''))
    :o.kind==='move'?'Set aside · GPay → PhonePe':o.kind==='planned'?'Set aside this month':'From '+aname(o.acct)+' · due '+fmtD(o.due);
  const btn=!o.paid&&!o.auto?`<button class="btn sm" data-act="pay" data-id="${o.id}">${o.kind==='planned'?'Bought':o.kind==='move'?'Move':'Pay'}</button>`:'';
  return `<div class="row"><div class="l"><span class="t">${esc(o.name)}</span><span class="m">${meta}</span></div><div class="r">${o.paid?'':`<span class="amt">${inr(o.amount)}</span>`}${oblStatus(o)}${btn}</div></div>`;
}

/* ===================== views ===================== */

  const M=S.month,c=calc(M),t=today();
  const al=alerts(c);ui.alertActs=al.map(a=>a.act);
  const shown=ui.allAlerts?al:al.slice(0,2);

  const aheadTxt=ah>=1?`<b class="pos">+${inr(ah)}</b> ahead`:ah<=-1?`<b class="negc">${inr(-ah)}</b> behind`:'on track';
  const unpaid=M.obligations.filter(o=>!o.paid).sort((a,b)=>a.due.localeCompare(b.due));

  <section class="sec"><div class="sec-h"><h2>Next due</h2>${unpaid.length>1?`<button class="linkbtn" data-tab="month">All dues (${unpaid.length})</button>`:''}</div>

    <div class="list">${recent.length?recent.map(txRow).join(''):'<div class="empty">Nothing logged yet. Tap + Add when you spend.</div>'}</div></section>`;

function viewMonth(){
  const M=S.month,c=calc(M),ms=monthSpend(M.key),t=today();
  const days=[];for(let d=M.key+'-01';d<=c.end;d=addDays(d,1))days.push(d);
  const maxv=Math.max(M.limit*1.6,...days.map(d=>SP[d]||0),1);

function newSetup(k,start,replan,carry){
  const A=S.accounts;
  const obl=replan?S.month.obligations.map(o=>({...o})):[...defaultObligations(k),...(carry||[])];
  for(const o of obl)if(!o.paid&&o.due<start&&!['planned','move'].includes(o.kind))o.pre=!!o.auto;
  const PM=S.month&&S.month.plan;
  return {k,start,replan,
    bal:Object.fromEntries(BANKS.map(id=>[id,r2(A[id].bal)])),card:r2(S.cardDue),
    planBy:(S.month&&S.month.planBy)||'target',
    target:replan||!PM||PM.target==null?(S.month?S.month.target:1500):PM.target,
    limitIn:replan||!PM||PM.limit==null?(S.month?S.month.limit:150):PM.limit,obl};
}
function readSetup(){
  const s=ui.setup;if(!s||!$('#su-card'))return;
  BANKS.forEach(id=>{const v=num($('#su-bal-'+id).value);if(!isNaN(v))s.bal[id]=v;});
  const cv=num($('#su-card').value);if(!isNaN(cv))s.card=cv;
  const ti=$('#su-target'),li=$('#su-limit');
  if(ti)s.target=num(ti.value)||0;
  if(li)s.limitIn=num(li.value)||0;
  s.obl.forEach(o=>{if(o.paid)return;const a=$('#su-oa-'+o.id),d=$('#su-od-'+o.id),n=$('#su-on-'+o.id),p=$('#su-op-'+o.id);
    if(a){const v=num(a.value);o.amount=isNaN(v)?0:v;} if(d&&d.value)o.due=d.value; if(n)o.name=n.value||'Planned purchase'; if(p)o.pre=p.checked;});
}
function setupPreview(){
  const s=ui.setup;buildSP();
  const usable=SPEND_ACCTS.reduce((a,id)=>a+(s.bal[id]-S.accounts[id].floor),0);
  const dues=s.obl.filter(o=>!o.paid&&!o.pre&&o.kind!=='card').reduce((a,o)=>a+(+o.amount||0),0);
  const moved=movedFor(s.k);
  const h=heldFor({key:s.k,startTs:'9999'});const held=h.extra+h.backOld+h.stipNext;
  const days=diffDays(s.start,monthEnd(s.k))+1;
  const base=usable-s.card-dues-held; // money for spending + savings this month
  const common={usable,card:s.card,dues,moved,held,days,base};
  if(s.planBy==='limit'){
    const L=Math.max(0,Math.floor(s.limitIn||0)),saveLeft=base-L*days;
    return {...common,mode:'limit',limit:L,saveLeft,ok:saveLeft>=0,target:moved+Math.floor(Math.max(0,saveLeft)),maxL:Math.max(0,Math.floor(base/days))};
  }
  const savingsLeft=Math.max(0,s.target-moved),sp=base-savingsLeft;
  return {...common,mode:'target',savingsLeft,sp,ok:true,target:s.target,limit:Math.max(0,Math.floor(sp/days))};
}

      ?`<label class="field"><span>Daily limit (₹ per day)</span><input id="su-limit" inputmode="numeric" value="${s.limitIn}"></label><p class="hint">Your savings for the month are worked out from it.</p>`
      :`<label class="field"><span>Amount to save this month</span><input id="su-target" inputmode="decimal" value="${s.target}"></label><p class="hint">Your daily limit is worked out from it.</p>`}
    <div class="plan" id="su-prev">${previewHTML(p)}</div>
    <button class="btn primary block" type="submit">Start ${s.replan?'new plan':monthName(s.k)}</button>
  </form>`;

function commitSetup(){
  readSetup();const s=ui.setup,ts=nowTs();
  if(s.planBy==='limit'){const p=setupPreview();
    if(!p.ok){toast(`${inr(p.limit)}/day is more than you have. The most you can set is ${inr(p.maxL)}/day.`);render();return false;}
    s.target=p.target;}
  BANKS.forEach(id=>{const diff=r2(s.bal[id]-S.accounts[id].bal);if(diff)addTx({type:'adjust',acct:id,amt:diff,cls:'fix',note:'Balance at plan start',ts});});
  const cd=r2(s.card-S.cardDue);if(cd)addTx({type:'adjust',acct:'card',amt:cd,cls:'fix',note:'Balance at plan start',ts});
  const co=s.obl.find(o=>o.kind==='card'&&!o.paid);
  if(S.cardDue>0){
    if(co&&!s.replan)co.amount=Math.round(S.cardDue);
    else if(!s.obl.some(o=>o.kind==='card'))s.obl.push({id:uid(),kind:'card',name:'Credit card bill',amount:Math.round(S.cardDue),due:s.k+'-'+pad(Math.min(S.settings.cardDay,daysInMonth(s.k))),acct:'gpay',paid:false});
  }else if(co)s.obl=s.obl.filter(o=>o!==co);
  for(const o of s.obl){if(!o.paid&&o.pre){o.paid=true;o.paidAmt=o.amount;o.paidOn=o.due;o.outside=true;}delete o.pre;}
  S.month=buildMonth(s.k,s.start,s.target,s.obl,ts,s.planBy);
  S.lastReconcile=today();ui.mode=null;ui.setup=null;ui.tab='today';ui.allAlerts=false;
  runAutopay();save();toast(s.planBy==='limit'?`Daily limit ${inr(S.month.limit)}, savings ${inr(S.month.target)}`:`Daily limit set: ${inr(S.month.limit)}`);
  return true;
}

      <label class="field"><span>When</span><input type="datetime-local" id="f-when" name="when" value="${nowTs()}"></label>

  if(sh.type==='reconcile'){

      <button class="btn primary block" type="submit">Next</button></form>`;
  }
  if(sh.type==='reconcile2'){
    return head('What were these?')+`<form class="sec" data-form="reconcile2">${sh.diffs.map((d,i)=>{
      const what=d.acct==='card'?(d.diff>0?inr(d.diff)+' more owed':inr(-d.diff)+' less owed'):(d.diff>0?inr(d.diff)+' more':inr(-d.diff)+' less');

      <button class="btn primary block" type="submit">Save</button></form>`;
  }
  if(sh.type==='rebal'){
    const c=calc(M),r=rebalance(M,c),behind=r.D<0,amt=inr(Math.abs(r.D)),dl=r.days===1?'day':'days';
    const optA=r.limitOK
      ?`<button class="opt" data-act="rebalgo" data-k="limit"><b>Daily limit ${inr(M.limit)} → ${inr(r.newLimit)}</b><span>Savings stay ${inr(M.target)}. The ${amt} is spread over the ${r.days} ${dl} ${r.over?'after today':'left, including today'}.</span></button>`

function reconOpts(d){
  if(d.acct==='card')return d.diff>0?[['unlogged','Card spending I didn\'t log'],['fix','Interest, fee or error']]:[['back','Refund'],['fix','Error']];
  return d.diff<0?[['unlogged','Spent, didn\'t log it'],['fix','Bank charge or error']]
    :[['back','Friend paid me back'],['extra','Extra income'],['stipend','Stipend'],['fix','Error or other']];
}

/* ===================== render ===================== */
function render(){
  buildSP();
  const t=today();
  if(!S.month&&ui.mode!=='setup')ui.mode='welcome';
  if(!ui.mode&&S.month&&mkey(t)>S.month.key)ui.mode='close';
  const app=$('#app');
  if(ui.mode==='welcome')app.innerHTML=viewWelcome();
  else if(ui.mode==='close')app.innerHTML=viewClose();
  else if(ui.mode==='setup')app.innerHTML=viewSetup();
  else app.innerHTML=({today:viewToday,ledger:viewLedger,month:viewMonth,more:viewMore})[ui.tab]();
  const full=!!ui.mode;
  $('#fab').hidden=full;$('#tabs').hidden=full;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===ui.tab?'page':'false'));
  const sh=sheetHTML();
  $('#sheet').innerHTML=sh?`<div class="overlay" data-act="overlay"><div class="sheet" role="dialog" aria-modal="true">${sh}</div></div>`:'';
  renderToast();
}
function renderToast(){$('#toast').innerHTML=ui.toast?`<div class="toast" role="status"><span>${esc(ui.toast)}</span>${ui.toastUndo&&ui.undo?'<button data-act="undo">Undo</button>':''}</div>`:'';}
let toastTimer;
function toast(msg,undo){ui.toast=msg;ui.toastUndo=!!undo;clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ui.toast=null;ui.toastUndo=false;ui.undo=null;renderToast();},undo?6000:3200);}
function openSheet(s){ui.sheet=s;render();setTimeout(()=>{const f=$('.sheet input:not([type=radio]):not([type=checkbox]):not([type=file])');if(f&&s.type==='add')f.focus();},50);}
function closeSheet(){ui.sheet=null;ui.editId=null;ui.prefill=null;ui.draftAmt='';ui.settlePid=null;render();}
function whenTs(fd){const w=fd.get('when');return w&&w.length>=16?w.slice(0,16):nowTs();}
function floorCheck(id){const a=S.accounts[id];if(a&&a.bal<a.floor)return ` ${a.name} is now ${inr(a.floor-a.bal)} below its minimum.`;return '';}
function safeNow(){return S.month&&!ui.mode?' Safe to spend today: '+inr(calc(S.month).safe)+'.':'';}
function updateRecBox(){const w=$('#f-when'),b=$('#f-recbox'),M=S.month;if(!w||!b||!M)return;b.hidden=!(M.startTs&&w.value.slice(0,16)<M.startTs);}
async function shareBackup(){
  const txt=JSON.stringify(S),name='stipend-ledger-'+today()+'.json';
  const done=m=>{S.lastBackup=today();save();toast(m);render();};
  try{
    const file=new File([txt],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Stipend Ledger backup'});done('Backup saved.');return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);done('Backup file downloaded.');}
  catch(e){toast('Couldn\'t save a file here. Use "Copy as text" instead.');}
}

/* ===================== events ===================== */
document.addEventListener('click',e=>{

      ui.prefill={amt:x.amt,acct:x.acct,cat:x.cat,note:x.note,sub:x.sub,forMonth:x.forMonth,from:x.from,to:x.to,ts:x.ts,share:x.share,pid:x.pid,rec:!!x.rec};openSheet({type:'add'});break;}
    case 'add':ui.editId=null;ui.addType='expense';ui.prefill=null;ui.draftAmt='';openSheet({type:'add'});break;

    case 'reconcile':openSheet({type:'reconcile'});break;
    case 'alertact':{const a=ui.alertActs[+el.dataset.i];if(!a)break;
      if(a.type==='transfer'){ui.editId=null;ui.addType='transfer';ui.prefill={from:a.from,to:a.to,amt:a.amt};openSheet({type:'add'});}
      else if(a.type==='pay')openSheet({type:'pay',id:a.id});
      else if(a.type==='reconcile')openSheet({type:'reconcile'});
      else if(a.type==='rebal')openSheet({type:'rebal'});
      else if(a.type==='replan'){ui.mode='setup';ui.setup=newSetup(S.month.key,today(),true);render();window.scrollTo(0,0);}
      else if(a.type==='tab'){ui.tab=a.tab;render();window.scrollTo(0,0);}
      break;}
    case 'allalerts':ui.allAlerts=true;render();break;
    case 'rebal':openSheet({type:'rebal'});break;
    case 'rebalgo':{const M=S.month,r=rebalance(M,calc(M));M.adj=M.adj||[];
      if(el.dataset.k==='limit'&&r.limitOK){M.adj.push({date:today(),kind:'limit',from:M.limit,to:r.newLimit});M.limit=r.newLimit;toast(`Daily limit is now ${inr(r.newLimit)}.`);}
      else if(el.dataset.k==='target'&&r.targetOK){M.adj.push({date:today(),kind:'target',from:M.target,to:r.newTarget});M.target=r.newTarget;toast(`Savings target is now ${inr(r.newTarget)}.`);}
      save();ui.sheet=null;render();break;}
    case 'row':ui.openRow=ui.openRow===el.dataset.id?null:el.dataset.id;render();break;
    case 'del':ui.undo=JSON.stringify(S);delTx(el.dataset.id);ui.openRow=null;save();toast('Entry deleted.',true);render();break;
    case 'undo':if(ui.undo){S=JSON.parse(ui.undo);ui.undo=null;ui.toast=null;save();toast('Restored.');render();}break;
    case 'lmonth':ui.ledgerMonth=el.dataset.k;render();break;
    case 'replan':ui.mode='setup';ui.setup=newSetup(S.month.key,today(),true);render();window.scrollTo(0,0);break;
    case 'cancelsetup':ui.mode=null;ui.setup=null;render();break;
    case 'addplanned':readSetup();ui.setup.obl.push({id:uid(),kind:'planned',name:'Planned purchase',amount:0,due:monthEnd(ui.setup.k),acct:'gpay',paid:false});render();break;
    case 'rmobl':readSetup();ui.setup.obl=ui.setup.obl.filter(o=>o.id!==el.dataset.id);render();break;
    case 'logyest':ui.editId=null;ui.addType='expense';ui.draftAmt='';ui.prefill={ts:monthEnd(S.month.key)+'T21:00'};openSheet({type:'add'});break;
    case 'person':ui.openPerson=ui.openPerson===el.dataset.id?null:el.dataset.id;render();break;
    case 'gotit':{const p=S.people.find(p=>p.id===el.dataset.id);if(!p)break;ui.editId=null;ui.addType='returned';ui.draftAmt='';ui.prefill={pid:p.id,amt:remaining(p)};openSheet({type:'add'});break;}
    case 'paidback':{const p=S.people.find(p=>p.id===el.dataset.id);if(!p)break;ui.editId=null;ui.addType='expense';ui.draftAmt='';ui.prefill={amt:remaining(p),note:'Paid back '+p.person,cat:'Misc'};ui.settlePid=p.id;openSheet({type:'add'});break;}
    case 'settle':{const p=S.people.find(p=>p.id===el.dataset.id);if(p){p.settled=true;ui.openPerson=null;save();toast('Marked settled.');render();}break;}
    case 'backup':shareBackup();break;
    case 'copybackup':{const txt=JSON.stringify(S);ui.backupText=txt;render();const ta=$('#bk-out');
      const ok=()=>{S.lastBackup=today();save();toast('Backup copied. Paste it into a note or email to yourself.');};
      try{navigator.clipboard.writeText(txt).then(ok,()=>{ta.select();toast('Select all and copy the text below.');});}catch(err){ta.select();toast('Select all and copy the text below.');}
      break;}
    case 'restoreopen':openSheet({type:'restore'});break;
    case 'resetopen':openSheet({type:'reset'});break;
    case 'doreset':try{localStorage.removeItem(KEY);}catch(err){}seed();save();ui={...ui,sheet:null,mode:null,tab:'today',setup:null};toast('All data erased. Starting fresh.');render();break;
  }
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f-split'){const b=$('#f-splitbox');if(b)b.hidden=!t.checked;if(t.checked){const s=$('#f-samt');if(s)s.focus();}}
  if(t.name==='sub'){const b=$('#f-forbox');if(b)b.hidden=t.value!=='stipend';}
  if(t.id==='f-when')updateRecBox();
  if(t.dataset&&t.dataset.drop){ui.closeDrop[t.dataset.drop]=!t.checked;render();}
  if(t.name==='planBy'&&ui.mode==='setup'&&ui.setup){ // switching carries the worked-out value across
    readSetup();const s=ui.setup,p=setupPreview();
    if(t.value==='limit'&&s.planBy!=='limit')s.limitIn=p.limit;
    if(t.value==='target'&&s.planBy==='limit'&&p.ok)s.target=p.target;
    s.planBy=t.value;render();const f=$(t.value==='limit'?'#su-limit':'#su-target');if(f)f.focus();}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,fd=new FormData(f),kind=f.dataset.form;
  const amt=num(fd.get('amt'));
  if(kind==='add'){
    if(!(amt>0)){toast('Enter an amount above zero.');return;}
    const ts=whenTs(fd),note=(fd.get('note')||'').trim(),ty=ui.addType,M=S.month;
    if(ty==='transfer'&&fd.get('from')===fd.get('to')){toast('Pick two different accounts.');return;}
    const early=!!(M&&M.startTs&&ts<M.startTs),rec=early&&fd.get('rec')==='on';
    const old=ui.editId?S.tx.find(x=>x.id===ui.editId):null;
    let fl,msg='Saved.';
    if(ty==='expense'){const acct=fd.get('acct');fl={type:'expense',amt,acct,cat:fd.get('cat'),note,ts};
      if(fd.get('split')==='on'){const sa=num(fd.get('shareAmt'));
        if(sa>0){if(sa>amt){toast("Their share can't be more than the total.");return;}fl.share={amt:sa,who:(fd.get('shareWho')||'').trim()||'Friends'};}}
      msg=`${inr(amt)} logged.`;}
    if(ty==='returned'){const pid=fd.get('pid')||'',p=pid&&S.people.find(q=>q.id===pid);
      fl={type:'returned',amt,acct:fd.get('acct'),note:p?p.person:note,ts};if(p){fl.pid=p.id;if(p.exp)fl.exp=p.exp;}
      msg=`${inr(amt)} back.`;}
    if(ty==='income'){const sub=fd.get('sub');fl={type:'income',amt,acct:fd.get('acct'),sub,note,ts};
      if(sub==='stipend')fl.forMonth=fd.get('forMonth')||stipendMonthFor(ts);
      msg=sub==='stipend'?`Stipend recorded for ${fullMon(fl.forMonth)}.`:`${inr(amt)} added to this month's savings.`;}
    if(ty==='transfer'){fl={type:'transfer',amt,from:fd.get('from'),to:fd.get('to'),note,ts};
      if(old&&old.type==='transfer'){if(old.forMonth)fl.forMonth=old.forMonth;if(old.obl)fl.obl=old.obl;}
      msg=`Moved ${inr(amt)} ${aname(fl.from)} → ${aname(fl.to)}.`;}
    if(rec)fl.rec=true;
    const x=old?editTx(old.id,fl):addTx(fl);
    if(x.type==='expense'||(old&&old.type==='expense'))syncShare(x);
    if(ui.settlePid&&x.type==='expense'){const p=S.people.find(q=>q.id===ui.settlePid);if(p){p.settled=true;p.paidTx=x.id;}}
    const fc=ty==='expense'?floorCheck(fl.acct):ty==='transfer'?floorCheck(fl.from):'';
    save();ui.sheet=null;ui.prefill=null;ui.draftAmt='';ui.editId=null;ui.openRow=null;ui.settlePid=null;
    toast((old?'Entry updated.':msg)+fc+(rec?'':safeNow()));render();return;
  }
  if(kind==='pay'){
    if(!(amt>0)){toast('Enter an amount above zero.');return;}
    const o=findObl(ui.sheet.id);if(!o)return;const acct=fd.get('acct');
    payObligation(o,amt,acct,whenTs(fd),fd.get('next')||null);save();ui.sheet=null;toast(`${o.name} done.`+floorCheck(acct));render();return;
  }
  if(kind==='reconcile'){
    const diffs=[];
    for(const id of [...BANKS,'card']){const v=num(fd.get(id));if(isNaN(v))continue;
      const cur=id==='card'?S.cardDue:S.accounts[id].bal,diff=r2(v-cur);if(Math.abs(diff)<0.01)continue;
      const def=id==='card'?(diff>0?'unlogged':'fix'):diff<0?'unlogged':(diff>=5000?'stipend':'back');
      diffs.push({acct:id,diff,def});}
    if(!diffs.length){S.lastReconcile=today();save();ui.sheet=null;toast('Everything matches.');render();return;}
    ui.sheet={type:'reconcile2',diffs};render();return;
  }
  if(kind==='reconcile2'){
    const ts=nowTs();
    ui.sheet.diffs.forEach((d,i)=>{const c=fd.get('c'+i)||d.def;
      if(c==='extra')addTx({type:'income',amt:d.diff,acct:d.acct,sub:'extra',note:'Found in balance check',ts});
      else if(c==='stipend')addTx({type:'income',amt:d.diff,acct:d.acct,sub:'stipend',forMonth:stipendMonthFor(ts),note:'Found in balance check',ts});
      else addTx({type:'adjust',acct:d.acct,amt:d.diff,cls:c,note:'Balance check',ts});});
    const n=ui.sheet.diffs.length;S.lastReconcile=today();save();ui.sheet=null;toast(`${n} correction${n>1?'s':''} saved.`+safeNow());render();return;
  }
  if(kind==='lent'){
    const person=(fd.get('person')||'').trim();if(!person||!(amt>0)){toast('Add a name and an amount.');return;}
    S.people.push({id:uid(),person,amt,dir:fd.get('dir')==='owe'?'owe':'owes',date:today(),settled:false});save();toast('Added.');render();return;
  }
  if(kind==='settings'){
    const st=S.settings,n=k=>num(fd.get(k));
    for(const id of ['gpay','paytm','phonepe']){const v=n('floor-'+id);if(!isNaN(v)&&v>=0)S.accounts[id].floor=v;}
    if(n('cardDay')>=1&&n('cardDay')<=31)st.cardDay=Math.round(n('cardDay'));
    if(n('ytAmount')>=0)st.ytAmount=n('ytAmount');
    if(n('ytDay')>=1&&n('ytDay')<=31)st.ytDay=Math.round(n('ytDay'));
    if(fd.get('rechargeNext'))st.rechargeNext=fd.get('rechargeNext');
    st.warnAt=st.warnAt||{};for(const id of ['gpay','paytm']){const v=n('warn-'+id);if(!isNaN(v)&&v>=0)st.warnAt[id]=v;}
    save();toast('Settings saved.');render();return;
  }
  if(kind==='restore'){
    const file=fd.get('file'),pasted=String(fd.get('text')||'').trim();
    const go=txt=>{try{const d=JSON.parse(txt);if(!d||!d.accounts||!d.settings||!Array.isArray(d.tx))throw 0;
        S=migrate(d);runAutopay();save();ui.sheet=null;ui.mode=null;ui.setup=null;ui.tab='today';toast('Backup restored.');render();}
      catch(err){toast("That isn't a Stipend Ledger backup. Use the whole file or text.");}};
    if(file&&file.size)file.text().then(go,()=>toast("Couldn't read that file."));
    else if(pasted)go(pasted);else toast('Choose a backup file or paste the text.');
    return;
  }
  if(kind==='close'){
    const d=ui.closeData,v=isNaN(amt)?0:Math.max(0,amt);
    if(v>d.maxMove){toast(`GPay only has ${inr(d.maxMove)} above its minimum. Lower the amount.`);return;}
    const M=S.month,nk=mkey(today()),ts=nowTs();
    if(v>0)addTx({type:'transfer',amt:v,from:'gpay',to:'phonepe',forMonth:M.key,note:'Month-end savings',ts});
    const rest=Math.round(d.toMove-v),keep=fd.get('rest')!=='spend';
    const carry=d.carry.map(o=>({...o,id:uid(),due:o.kind==='planned'?monthEnd(nk):nk+'-01'}));
    if(rest>=1&&keep)carry.push({id:uid(),kind:'move',name:`${mon(M.key)} savings to move`,amount:rest,from:M.key,acct:'gpay',due:nk+'-01',paid:false});
    const moved=movedFor(M.key);
    S.history.push({key:M.key,limit:M.limit,spent:d.ms.spent,target:M.target,extra:d.extra,saved:moved+(rest>=1&&keep?rest:0),moved,cats:d.ms.cats});
    ui.mode='setup';ui.setup=newSetup(nk,today(),false,carry);ui.closeData=null;ui.closeDrop=null;save();render();window.scrollTo(0,0);return;
  }
  if(kind==='welcome'){
    const n=k=>num(fd.get(k)),st=S.settings;
    const card=n('card');S.cardDue=isNaN(card)?0:card;
    if(n('cardDay')>=1&&n('cardDay')<=31)st.cardDay=Math.round(n('cardDay'));
    if(n('rprice')>=0)st.rechargeLast=n('rprice');
    st.rechargeNext=fd.get('rnext')||null;
    if(n('yt')>=0)st.ytAmount=n('yt');
    if(n('ytDay')>=1&&n('ytDay')<=31)st.ytDay=Math.round(n('ytDay'));
    st.ytAcct=fd.get('ytAcct')||'paytm';
    for(const id of ['gpay','paytm','phonepe']){const v=n('floor-'+id);if(!isNaN(v)&&v>=0)S.accounts[id].floor=v;}
    save();ui.mode='setup';ui.setup=newSetup(mkey(today()),today(),false);render();window.scrollTo(0,0);return;
  }
  if(kind==='setup'){if(commitSetup()){render();window.scrollTo(0,0);}return;}
});

/* ===================== start ===================== */
load();runAutopay();save();render();
let lastDay=today();
function dayTick(){const t=today();if(t===lastDay||!S.month)return;if(ui.sheet||ui.mode==='setup')return;lastDay=t;runAutopay();save();render();}
setInterval(dayTick,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)dayTick();});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
</script>
